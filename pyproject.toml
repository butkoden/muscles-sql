[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscles-sql"
version = "1.0.0"
description = "Muscles SQL data layer for repositories, migrations and AI-first workflow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Denis B.", email = "denis@butko.info" }]
dependencies = [
  "muscles>=1.0.0rc1,<2.0.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "click>=8.1,<9.0",
  "pydantic>=2.7,<3.0",
]

[project.urls]
Homepage = "https://github.com/butkoden/muscles-sql"
Repository = "https://github.com/butkoden/muscles-sql"
Documentation = "https://github.com/butkoden/muscles-sql#readme"
PyPI = "https://pypi.org/project/muscles-sql/"
Releases = "https://github.com/butkoden/muscles-sql/releases"
"muscles" = "https://pypi.org/project/muscles/"
"muscles-documents" = "https://pypi.org/project/muscles-documents/"
"muscles-ai" = "https://pypi.org/project/muscles-ai/"
"muscles-otel" = "https://pypi.org/project/muscles-otel/"
"muscles-benchmarks" = "https://pypi.org/project/muscles-benchmarks/"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
muscles-sql = "muscles_sql.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
